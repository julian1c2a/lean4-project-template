name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: lake build
    runs-on: ubuntu-latest

    steps:
      # ⚠⚠ SI ESTE PROYECTO TIENE DEPENDENCIAS LOCALES (`require X from "../X"`), este
      # checkout único NO BASTA: el runner no tiene el árbol de la hermana y el build muere
      # con «X: package directory not found». Y como `actions/checkout` no admite un `path:`
      # fuera del workspace, hay que clonar TAMBIÉN este repo en un subdirectorio para que
      # `../X` caiga dentro. El patrón completo, ya probado en ROBINSON_PlusPlus y PeanoRF:
      #
      #   jobs:
      #     build:
      #       defaults:
      #         run:
      #           working-directory: MiProyecto      # los `run` salen de la raíz del repo
      #       steps:
      #         - uses: actions/checkout@v4
      #           with: { path: MiProyecto }
      #         - uses: actions/checkout@v4
      #           with: { repository: usuario/X, ref: master, path: X }
      #
      # ⚠️ Los `path:`/`hashFiles` de un `uses:` NO ven el `working-directory`: van con el
      #    prefijo del subdirectorio.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan (Lean version manager)
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --no-modify-path
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      # ⚠️ Escalar de BLOQUE (`run: |`) a propósito. En una sola línea, el `-d:` de
      # `cut` lleva dos puntos seguidos de espacio y YAML lo interpreta como un mapa:
      # «mapping values are not allowed here», y el workflow ni arranca (falla en 0s
      # con «workflow file issue»). Detectado 2026-09-06 en el primer push real.
      - name: Install Lean toolchain
        run: |
          elan toolchain install $(cut -d: -f2 lean-toolchain)

      - name: Cache Lake packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake/packages
          key: ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain', 'lakefile.lean') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      - name: Build
        run: lake build

      - name: Check for sorry
        run: bash check-sorry.bash
        continue-on-error: true   # Warning only — change to false to make it blocking

      # El control de sincronía documentación ↔ código (AI-GUIDE §27). BLOQUEANTE y SIN
      # `--quick`: con `--quick` no se comprueba la cifra de `jobs`, y entonces el banner
      # no lo verifica nadie más que una ejecución local. El `lake build` de arriba ya dejó
      # todo cacheado, así que repetirlo aquí es barato.
      - name: Check doc sync
        run: bash check-doc-sync.bash
